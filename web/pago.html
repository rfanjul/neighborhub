<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Neighborhub</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .vuelta { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .vuelta-tarjeta { max-width: 460px; text-align: center; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: 36px 28px; }
    .vuelta-tarjeta img { width: 64px; height: 64px; border-radius: 16px; }
    .vuelta-tarjeta h1 { font-size: 30px; margin: 16px 0 8px; }
    .vuelta-tarjeta p { color: var(--gris); font-size: 18px; margin: 0 0 12px; }
    .vuelta-tarjeta .pista { font-size: 15px; }
  </style>
</head>
<body>
  <main class="vuelta">
    <div class="vuelta-tarjeta">
      <img src="/img/icono-512.png" alt="Neighborhub">
      <h1 id="titulo"></h1>
      <p id="texto"></p>
      <p class="pista" id="volver"></p>
    </div>
  </main>
  <script>
    // Vuelta desde Stripe (pago): el texto según ?estado y el idioma del móvil.
    (function () {
      var textos = {"ok": {"en": ["Payment done", "Go back to Neighborhub: your request is now under way. We hold the money until you mark it as done."], "de": ["Zahlung erledigt", "Geh zurück zu Neighborhub: Deine Anfrage läuft. Wir halten das Geld zurück, bis du sie als erledigt markierst."], "es": ["Pago hecho", "Vuelve a Neighborhub: tu servicio ya está en marcha. Guardamos el dinero hasta que lo marques como hecho."]}, "cancelado": {"en": ["Payment cancelled", "Nothing has been charged. Go back to Neighborhub to choose again."], "de": ["Zahlung abgebrochen", "Es wurde nichts belastet. Geh zurück zu Neighborhub, um erneut auszuwählen."], "es": ["Pago cancelado", "No se ha cobrado nada. Vuelve a Neighborhub para elegir de nuevo."]}};
      var volver = {"en": "On iPhone, tap “◀ Neighborhub” at the top left, or open the app.", "de": "Tippe auf dem iPhone oben links auf „◀ Neighborhub“ oder öffne die App.", "es": "En el iPhone, toca «◀ Neighborhub» arriba a la izquierda, o abre la app."};
      var estado = new URLSearchParams(location.search).get('estado');
      var idioma = (navigator.language || 'en').slice(0, 2);
      if (!volver[idioma]) idioma = 'en';
      var t = (textos[estado] || textos["ok"])[idioma];
      document.documentElement.lang = idioma;
      document.getElementById('titulo').textContent = t[0];
      document.getElementById('texto').textContent = t[1];
      document.getElementById('volver').textContent = volver[idioma];
    })();
  </script>
</body>
</html>
