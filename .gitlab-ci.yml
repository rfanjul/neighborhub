# Pipeline: en cada push se comprueban los tipos y se pasan los tests con
# cobertura. El porcentaje aparece en el pipeline y en los merge requests;
# el informe navegable queda como artefacto (y publicado en Pages desde main).

default:
  image: node:22-alpine
  # node_modules se reutiliza entre pipelines mientras no cambie el lockfile.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

stages:
  - test
  - deploy

test:
  stage: test
  script:
    - npm run typecheck
    - npm test -- --coverage --ci --runInBand
  # GitLab lee el porcentaje total de la línea "Statements" del resumen.
  coverage: '/^Statements\s*:\s*([0-9.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      junit: coverage/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# El informe HTML de cobertura, navegable en GitLab Pages.
pages:
  stage: deploy
  needs:
    - test
  dependencies:
    - test
  before_script: []
  script:
    - mv coverage/lcov-report public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
